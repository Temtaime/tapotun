name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
            artifact: tapotun-x86_64
            alpine_arm64: false
          - arch: aarch64
            os: ubuntu-24.04-arm
            artifact: tapotun-aarch64
            alpine_arm64: true

    runs-on: ${{ matrix.os }}
    container: alpine

    steps:
      - if: matrix.alpine_arm64
        uses: laverdet/alpine-arm64@v1

      - uses: actions/checkout@v4

      - run: apk add ldc dub clang20 llvm lld libc-dev libc++-dev linux-headers zstd-static libc++-static

      - run: |
          dub build -a ${{ matrix.arch }} -b release-nobounds
          mv tapotun tapotun_$(uname -m)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: tapotun_*
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ build-linux ]
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' && !contains(github.event.head_commit.message, 'WIP')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - uses: anothrNick/github-tag-action@1.35.0
        id: create_tag
        env:
          WITH_V: true
          DEFAULT_BUMP: patch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          files: release-assets/**/tapotun_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
